<details><summary>共通の導入・01脱毛・02ホワイトニングを見る</summary><div class="common"><img src="assets/intro.webp" width="1448" height="1086" alt="マシンと技術で、仕上がりまでこだわる。顔まわりから、手元・爪まで。一人ひとりの状態に合わせて、細部まで丁寧に整えます。" loading="lazy" decoding="async"><img src="assets/machine-01.webp" width="948" height="1659" alt="01 脱毛マシン ZERO ONE。肌への負担を抑えながら、妥協のない脱毛効果を実現。痛みに配慮しながら、ヒゲ・体毛をスピーディーにケアします。痛みをほとんど感じにくく、麻酔不要。幅広い毛質に対応。産毛から濃い毛までケア。冷却×連射でスピーディーにケア。日本製マシンを日本人が徹底管理。1000人以上の肌と向き合ってきた信頼と安心。" loading="lazy" decoding="async"><img src="assets/machine-02.webp" width="948" height="1659" alt="02 ホワイトニング 高出力マシン。本来の輝く白さへ。蓄積された歯の黄ばみや着色汚れに、痛みに配慮しながらしっかりアプローチします。痛み・刺激に配慮。過酸化水素不使用で、やさしい白い歯へ。歯の着色汚れにしっかりアプローチ。歯の表面をコーティングして、着色からガード。30分の短時間ケア。予定の合間にも通いやすい。殺菌効果で口臭予防もサポート。施術後の制限なし。施術後すぐに飲食OKだから、予定の邪魔をしない。" loading="lazy" decoding="async"></div></details>
