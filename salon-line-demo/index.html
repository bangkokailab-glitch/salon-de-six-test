function addDays(day, count) {
  const value = new Date(`${day}T00:00:00Z`);
  value.setUTCDate(value.getUTCDate() + count);
  return value.toISOString().slice(0, 10);
}

function bangkokDay(now = new Date()) {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Bangkok', year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(now);
  const value = type => parts.find(part => part.type === type)?.value || '';
  return `${value('year')}-${value('month')}-${value('day')}`;
}

function customerSegment(state, customerId) {
  const bookings = state.bookings.filter(booking => booking.customerId === customerId);
  if (bookings.some(booking => booking.status === 'attended')) return '来店済み';
  if (bookings.some(booking => ['confirmed', 'pending'].includes(booking.status)))
    return '初回来店前の予約あり';
  return 'LINE登録のみ';
}

const minute = value => Number(value.slice(0, 2)) * 60 + Number(value.slice(3));
function canConfirmDemo(state, booking) {
  const menu = state.menus.find(item => item.id === booking?.menuId);
  if (!menu?.verified || !menu.resource || !/^\d{4}-\d{2}-\d{2}$/.test(booking.day || '')
    || !/^([01]\d|2[0-3]):[0-5]\d$/.test(booking.time || ''))
    return { ok: false, reason: '設備・所要時間の確認が必要です' };
  const start = minute(booking.time), end = start + menu.duration + menu.cleanup;
  if (start < minute(state.settings.open) || start > minute(state.settings.lastStart)
    || end > minute(state.settings.close))
    return { ok: false, reason: '営業時間外です' };
  for (const other of state.bookings) {
    if (other.id === booking.id || other.day !== booking.day
      || !['confirmed', 'attended'].includes(other.status)) continue;
    const otherMenu = state.menus.find(item => item.id === other.menuId);
    if (otherMenu?.resource !== menu.resource) continue;
    const otherStart = minute(other.time);
    if (start < otherStart + otherMenu.duration + otherMenu.cleanup && otherStart < end)
      return { ok: false, reason: '同じ設備の予約と重なります' };
  }
  return { ok: true };
}

function shiftMinutes(day, time, minutes) {
  const epoch = Date.parse(`${day}T${time}:00+07:00`) + minutes * 60_000;
  return new Date(epoch + 7 * 60 * 60_000).toISOString().slice(0, 16);
}

function simulateCrm(state, atLocal) {
  if (!/^\d{4}-\d{2}-\d{2}T([01]\d|2[0-3]):[0-5]\d$/.test(atLocal || '')) return [];
  const atDay = atLocal.slice(0, 10);
  const results = [];
  for (const rule of state.rules.filter(item => item.enabled)) {
    for (const customer of state.customers) {
      if (customer.optedOut || customer.botPaused) continue;
      const bookings = state.bookings.filter(item => item.customerId === customer.id);
      const active = bookings.filter(item => item.status === 'confirmed');
      const attended = bookings.filter(item => item.status === 'attended');
      let eligible = false;
      if (rule.kind === 'day_before') eligible = active.some(item =>
        `${addDays(item.day, -1)}T${rule.time}` === atLocal);
      else if (rule.kind === 'hour_before') eligible = active.some(item =>
        shiftMinutes(item.day, item.time, -60) === atLocal);
      else if (rule.kind === 'thank_you') eligible = attended.some(item =>
        `${item.day}T${rule.time}` === atLocal);
      else if (rule.kind === 'followup') eligible = attended.some(item =>
        `${addDays(item.day, rule.days)}T${rule.time}` === atLocal)
        && !active.some(item => item.day >= atDay);
      else if (rule.kind === 'birthday') eligible = customer.birthdayConsent
        && customer.birthday === atDay.slice(5) && rule.time === atLocal.slice(11);
      else if (rule.kind === 'performed') eligible = attended.some(item =>
        item.performedMenuIds?.includes(rule.menuId))
        && rule.sendDate === atDay && rule.time === atLocal.slice(11);
      if (eligible) results.push({ ruleId: rule.id, customerId: customer.id,
        customer: customer.name, label: rule.label,
        text: customer.locale === 'en' ? rule.textEn : customer.locale === 'th'
          ? rule.textTh : rule.text });
    }
  }
  return results;
}

function safeDemoState(value) {
  if (!value || value.version !== 2 || value.synthetic !== true
    || !Array.isArray(value.customers) || !Array.isArray(value.bookings)
    || !Array.isArray(value.rules) || !Array.isArray(value.menus)) return null;
  const record = item => item !== null && typeof item === 'object' && !Array.isArray(item);
  const text = item => typeof item === 'string';
  if (!Number.isSafeInteger(value.nextId) || value.nextId < 1
    || !value.customers.length || !value.menus.length || !value.rules.length
    || !Array.isArray(value.campaigns) || !Array.isArray(value.audit)
    || !record(value.settings) || !Array.isArray(value.settings.closedDates)
    || !['open', 'close', 'lastStart'].every(key => text(value.settings[key]))
    || !value.customers.every(item => record(item) && text(item.id) && text(item.name)
      && text(item.locale) && Array.isArray(item.interests)
      && item.interests.every(text) && Array.isArray(item.chat)
      && item.chat.every(entry => record(entry) && text(entry.from)
        && text(entry.text) && text(entry.at)))
    || !value.menus.every(item => record(item) && text(item.id) && text(item.name)
      && Number.isFinite(item.duration) && Number.isFinite(item.cleanup))
    || !value.bookings.every(item => record(item) && text(item.id)
      && text(item.customerId) && text(item.menuId) && text(item.day)
      && text(item.time) && text(item.status)
      && (item.performedMenuIds === undefined || Array.isArray(item.performedMenuIds)))
    || !value.rules.every(item => record(item) && text(item.id)
      && text(item.label) && text(item.kind) && text(item.time)
      && ['text', 'textEn', 'textTh'].every(key => text(item[key])))
    || !value.campaigns.every(item => record(item) && text(item.title)
      && text(item.expires))
    || !value.audit.every(item => record(item) && text(item.at) && text(item.text)))
    return null;
  // Refuse to hydrate records that look like LINE identifiers or Google event
  // provenance. This browser preview is deliberately independent of live APIs.
  const serialized = JSON.stringify(value);
  if (/\bU[0-9a-f]{32}\b|@\d{3}[a-z0-9]{4,}|google_event_id|calendarId/i.test(serialized))
    return null;
  return value;
}

    const chat = current.chat.map(item => `<div class="bubble ${item.from === 'staff' ? 'outgoing' : ''}">${h(item.text)}<small>${item.from === 'staff' ? 'スタッフのデモ下書き' : '架空の受信'} · ${h(item.at)}</small></div>`).join('');
    return `<div class="inbox-grid">${panel('架空の会話一覧', `<div class="list">${list}</div>`)}${panel(current.name,
      `<div class="demo-controls"><span class="badge">${h(customerSegment(state, current.id))}</span>${button(current.botPaused ? '有人対応を解除' : '有人対応に切替', 'toggle-human', current.id)}</div>
      <p class="demo-note">ここでの返信はブラウザー内だけに残り、LINEへは送られません。</p><div class="conversation demo-chat">${chat}</div>
      <form class="reply" data-form="reply"><input name="text" maxlength="500" required aria-label="デモ返信文" placeholder="デモ返信文を入力"><button class="action" type="submit">下書きを残す</button></form>`)}</div>`;
  }

  function customersView() {
    const segments = ['all', 'LINE登録のみ', '初回来店前の予約あり', '来店済み'];
    const shown = state.customers.filter(item => segment === 'all' || customerSegment(state, item.id) === segment);
    const current = shown.find(item => item.id === selectedCustomer) || shown[0] || state.customers[0];
    selectedCustomer = current.id;
    const rows = shown.map(item => `<tr><td>${h(item.name)}</td><td>${h(item.fullName || '未入力')}</td><td>${h(customerSegment(state, item.id))}</td><td>${h(item.locale)}</td><td>${button('編集', 'select-customer', item.id)}</td></tr>`).join('');
    return `${panel('顧客区分', `<div class="demo-controls">${segments.map(value => button(value === 'all' ? 'すべて' : value, 'segment', value, segment === value ? '' : 'secondary')).join('')}</div><p class="subtle">予約確定だけで「来店済み」にはしません。施術履歴と興味タグも別に扱います。</p>`)}
      <div class="grid2">${panel('架空の顧客台帳', `<div class="table-wrap"><table><thead><tr><th>表示名</th><th>フルネーム</th><th>区分</th><th>言語</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`)}
      ${panel(`${current.name} のプロフィール`, `<form class="form-grid" data-form="profile">${field('fullName','フルネーム',current.fullName)}${field('birthday','誕生日（月日）',current.birthday,'text','placeholder="MM-DD" pattern="(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])"')}
      <label class="field">案内言語<select name="locale">${[['ja','日本語'],['en','English'],['th','ไทย']].map(([value,label]) => `<option value="${value}" ${current.locale === value ? 'selected' : ''}>${label}</option>`).join('')}</select></label>
      <label class="field full">興味タグ（カンマ区切り）<input name="interests" value="${attr(current.interests.join(', '))}"></label>
      <label class="field full">スタッフ専用メモ<textarea name="note" maxlength="500">${h(current.note)}</textarea></label>
      <label class="demo-check"><input type="checkbox" name="birthdayConsent" ${current.birthdayConsent ? 'checked' : ''}>誕生日メッセージへの同意あり</label>
      <label class="demo-check"><input type="checkbox" name="optedOut" ${current.optedOut ? 'checked' : ''}>配信停止</label>
      <div class="field full"><button class="action" type="submit">ブラウザー内へ保存</button></div></form>`)}</div>`;
  }

  function bookingRows(filter = null) {
    const values = state.bookings.filter(item => !filter || item.status === filter)
      .sort((a, b) => `${a.day}T${a.time}`.localeCompare(`${b.day}T${b.time}`));
    return values.length ? values.map(item => `<tr><td>${h(item.day)} ${h(item.time)}</td><td>${h(customer(item.customerId)?.name)}</td><td>${h(menu(item.menuId)?.name)}</td><td><span class="badge ${item.status === 'pending' ? 'gold' : ''}">${h(status(item.status))}</span></td><td>${button('詳細', 'select-booking', item.id)}</td></tr>`).join('')
      : `<tr><td colspan="5" class="demo-empty">対象の架空予約はありません</td></tr>`;
  }

  function bookingDetail() {
    const item = booking(selectedBooking);
    if (!item) return '<p class="empty">予約を選んでください。</p>';
    const result = canConfirmDemo(state, item);
    return `<p class="subtle">${h(customer(item.customerId)?.name)} · ${h(menu(item.menuId)?.name)} · ${h(status(item.status))}</p>
      <form class="form-grid" data-form="booking-edit">${field('day','希望日（バンコク）',item.day,'date')}${field('time','開始時刻',item.time,'time')}
      <div class="button-row field full"><button type="submit" class="action secondary">日時変更を保存</button>${item.status === 'pending' ? button('スタッフ確認で確定', 'confirm-booking', item.id, '') : ''}${item.status === 'confirmed' ? button('来店済みに記録', 'mark-attended', item.id) : ''}${item.status !== 'cancelled' ? button('取消（履歴保持）', 'cancel-booking', item.id, 'danger') : ''}</div></form>
      <p class="footnote">${item.status === 'pending' ? h(result.ok ? 'デモ内では確定可能。実Google予定は作りません。' : result.reason) : '変更・取消もデモデータだけに反映します。'}</p>`;
  }

  function bookingsView(filter = null) {
    const times = ['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];
    const calendar = `<div class="booking-calendar"><div class="calendar-toolbar"><strong>日別のデモ予約表</strong><label class="field">日付 <input type="date" id="demo-calendar-day" value="${attr(selectedDay)}"></label></div><div class="calendar-scroll"><table class="booking-time-grid day"><thead><tr><th>時刻</th><th>デモ予約</th></tr></thead><tbody>${times.map(time => {
      const rows = state.bookings.filter(item => item.day === selectedDay && item.time.slice(0,2) === time.slice(0,2) && item.status !== 'cancelled');
      return `<tr><td class="time-label">${time}</td><td>${rows.map(item => `<button class="booking-chip ${item.status === 'pending' ? 'pending' : ''}" data-action="select-booking" data-id="${attr(item.id)}">${h(customer(item.customerId)?.name)}<small>${h(menu(item.menuId)?.name)} · ${h(status(item.status))}</small></button>`).join('')}</td></tr>`;
    }).join('')}</tbody></table></div></div>`;
    return `${panel(filter ? 'スタッフ確認待ちの予約' : '架空の予約カレンダー', `<p class="demo-note">実際の空き枠・Google予定は表示していません。設備が未確定の施術は確定操作を止めます。</p>${filter ? '' : calendar}
      <div class="table-wrap"><table><thead><tr><th>日時（バンコク）</th><th>顧客</th><th>メニュー</th><th>状態</th><th></th></tr></thead><tbody>${bookingRows(filter)}</tbody></table></div>`)}
      <div class="grid2">${panel('予約の詳細・操作', bookingDetail())}${panel('架空の予約希望を追加', `<form class="form-grid" data-form="booking-new"><label class="field">顧客<select name="customerId">${state.customers.map(item => `<option value="${attr(item.id)}">${h(item.name)}</option>`).join('')}</select></label>
      <label class="field">メニュー<select name="menuId">${state.menus.map(item => `<option value="${attr(item.id)}">${h(item.name)}</option>`).join('')}</select></label>${field('day','希望日',addDays(bangkokDay(),1),'date')}${field('time','開始時刻','11:00','time')}<div class="field full"><button class="action" type="submit">確認待ちに追加</button></div></form>`)}</div>`;
  }

  function crmView() {
    const current = state.rules.find(item => item.id === selectedRule) || state.rules[0];
    const rows = state.rules.map(item => `<button class="list-item ${item.id === current.id ? 'selected' : ''}" type="button" data-action="select-rule" data-id="${attr(item.id)}"><strong>${h(item.label)}</strong><span>${item.enabled ? '設定ON' : '設定OFF'} · 送信なし</span></button>`).join('');
    const results = simulation ? simulation.results.map(item => `<div class="demo-row"><div><strong>${h(item.customer)} · ${h(item.label)}</strong><small>${h(item.text)}</small></div><span class="demo-feature-label">候補のみ</span></div>`).join('') : '';
    return `${panel('CRMは無送信シミュレーション', `<p class="demo-note">ルールをONにしても外部配信は始まりません。日時を進めると対象候補だけを表示します。施術履歴別の案内はデモで指定した日に一度だけ候補になります。取消・配信停止・次回予約を再確認します。</p>`)}
      <div class="grid2">${panel('通知ルール', `<div class="list">${rows}</div>`)}${panel(current.label, `<form class="form-grid" data-form="rule"><label class="demo-check"><input type="checkbox" name="enabled" ${current.enabled ? 'checked' : ''}>このデモルールをON</label>
      ${field('time','配信時刻（バンコク）',current.time,'time',current.kind === 'hour_before' ? 'disabled' : '')}${current.kind === 'followup' ? field('days','来店後何日',current.days,'number','min="1" max="30"') : ''}${current.kind === 'performed' ? field('sendDate','デモ配信日（1回のみ）',current.sendDate,'date','required') : ''}
      <label class="field full">日本語<textarea name="text" maxlength="300">${h(current.text)}</textarea></label><label class="field full">English<textarea name="textEn" maxlength="300">${h(current.textEn)}</textarea></label><label class="field full">ไทย<textarea name="textTh" maxlength="300">${h(current.textTh)}</textarea></label>
      <div class="field full"><button class="action" type="submit">デモ設定を保存</button></div></form>`)}</div>
      ${panel('時計を進めて候補を確認', `<form class="demo-inline-form" data-form="simulate"><label class="field">シミュレーション日時（バンコク）<input name="at" type="datetime-local" required value="${attr(simulation?.at || `${addDays(bangkokDay(),1)}T10:00`)}"></label><button type="submit" class="action">候補を計算（送信なし）</button></form><div class="demo-list">${simulation ? (results || '<p class="demo-empty">この日時に送信候補はありません。</p>') : '<p class="demo-empty">日時を選び、シミュレーションしてください。</p>'}</div>`)}`;
  }

  function menuView() {
    return `${panel('メニュー', `<div class="demo-grid">${state.menus.map(item => `<div class="demo-tile"><strong>${h(item.name)}</strong><small>${h(item.duration)}分＋片付け${h(item.cleanup)}分 · ${item.verified ? h(item.resource) : '設備順の確認待ち'}</small><small>料金：${item.price ? `${h(item.price)} THB` : '未設定'}</small><span class="demo-feature-label">${item.verified ? 'デモ内で確定可' : 'スタッフ確認のみ'}</span></div>`).join('')}</div><p class="footnote">未確認の料金・キャンペーンを実店舗の約束として表示しません。</p>`)}
      ${panel('デモ用キャンペーン', `<div class="demo-grid">${state.campaigns.map(item => `<div class="demo-tile"><strong>DEMO · ${h(item.title)}</strong><small>終了日 ${h(item.expires)}</small></div>`).join('') || '<p class="demo-empty">登録されたデモ用キャンペーンはありません。</p>'}</div><form class="demo-inline-form" data-form="campaign">${field('title','デモタイトル','','text','required maxlength="80"')}${field('expires','終了日',addDays(bangkokDay(),14),'date','required')}<button class="action" type="submit">架空デモに追加</button></form>`)}`;
  }

  function knowledgeView() {
    const rows = DEMO_FAQ.filter(item => `${item.question} ${item.answer}`.includes(faqSearch)).slice(0,24);
    return `${panel('共有済みの質問と回答 24件', `<p class="demo-note">日本語の正規FAQの閲覧例です。英語・タイ語も実TESTコードにありますが、この架空プレビューでは送信しません。料金や医療的な個別判断はスタッフ確認です。</p><label class="field">質問を検索<input id="faq-search" value="${attr(faqSearch)}" placeholder="営業時間など"></label><div class="demo-list">${rows.map(item => `<details class="demo-tile"><summary>${h(item.question)}</summary><p class="subtle">${h(item.answer)}</p></details>`).join('') || '<p class="demo-empty">一致するFAQはありません。</p>'}</div>`)}`;
  }

  function settingsView() {
    const s = state.settings;
    return `${panel('架空デモ用の受付設定', `<p class="demo-note">保存しても実店舗・LINE・Googleには反映されません。休業日の具体日は店舗からの確定待ちです。</p><form class="form-grid" data-form="settings">${field('open','営業開始',s.open,'time')}${field('close','営業終了',s.close,'time')}${field('lastStart','最終受付',s.lastStart,'time')}${field('staffWeekday','平日スタッフ数',s.staffWeekday,'number','min="1" max="20"')}${field('staffWeekend','土日祝スタッフ数',s.staffWeekend,'number','min="1" max="20"')}<div class="field full"><button class="action" type="submit">架空デモに保存</button></div></form>`)}
      ${panel('デモの初期化', `<p class="subtle">このブラウザー内の架空操作履歴だけを消して最初の状態に戻します。</p>${button('架空データを初期化', 'reset-demo', '', 'danger')}`)}`;
  }

  function render() {
    title.textContent = names[view];
    document.querySelectorAll('[data-view]').forEach(item => item.classList.toggle('active', item.dataset.view === view));
    const html = view === 'test' ? panel('実TEST接続', '<div id="test-connection-root"></div>') : view === 'overview' ? overviewView()
      : view === 'inbox' ? inboxView()
      : view === 'customers' ? customersView()
      : view === 'bookings' ? bookingsView()
      : view === 'requests' || view === 'review' ? bookingsView('pending')
      : view === 'crm' ? crmView()
      : view === 'menus' ? menuView()
      : view === 'knowledge' ? knowledgeView()
      : view === 'shifts' ? panel('スタッフ体制', `<div class="cards">${metric('平日', state.settings.staffWeekday, '担当固定なし')}${metric('土日祝', state.settings.staffWeekend, 'タイの祝日基準')}</div><p class="subtle">個別シフトと実カレンダーの勤務情報は、この架空デモには入っていません。人数設定は「設定」で操作できます。</p>`)
      : settingsView();
    app.innerHTML = (view === 'test' ? '' : banner) + html; document.getElementById('connection-pill').textContent = '実TEST未接続'; document.dispatchEvent(new Event('salon-test-panel'));
  }

  document.addEventListener('click', event => {
    const nav = event.target.closest('[data-view]');
    if (nav) { location.hash = `#/${nav.dataset.view}`; return; }
    const control = event.target.closest('[data-action]');
    if (!control) return;
    const { action, id } = control.dataset;
    if (action === 'go') { location.hash = `#/${id}`; return; }
    if (action === 'select-customer') { selectedCustomer = id; render(); return; }
    if (action === 'select-booking') { selectedBooking = id; render(); return; }
    if (action === 'select-rule') { selectedRule = id; render(); return; }
    if (action === 'segment') { segment = id; render(); return; }
    if (action === 'toggle-human') { const item = customer(id); item.botPaused = !item.botPaused;
      save(`${item.name}の有人対応を${item.botPaused ? '開始' : '解除'}しました（デモのみ）`); return; }
    if (action === 'cancel-booking') { const item = booking(id); item.status = 'cancelled';
      save(`${id}を取り消しました（架空予約のみ・履歴保持）`); return; }
    if (action === 'confirm-booking') { const item = booking(id), result = canConfirmDemo(state, item);
      if (!result.ok) { message(result.reason, true); return; }
      item.status = 'confirmed'; save(`${id}をデモ内で確定しました（Google予定なし）`); return; }
    if (action === 'mark-attended') { const item = booking(id); item.status = 'attended';
      item.performedMenuIds = [item.menuId]; save(`${id}の来店と実施メニューをデモ内に記録しました`); return; }
    if (action === 'reset-demo') { localStorage.removeItem(DEMO_STORAGE_KEY); state = seedDemo();
      selectedCustomer = 'D-A'; selectedBooking = 'DEMO-B1'; selectedRule = 'day-before';
      simulation = null; save('架空データを初期化しました'); }
  });

  document.addEventListener('change', event => {
    if (event.target.id === 'demo-calendar-day') { selectedDay = event.target.value; render(); }
  });
  document.addEventListener('input', event => {
    if (event.target.id === 'faq-search') { faqSearch = event.target.value; render();
      const input = document.querySelector('#faq-search'); input?.focus(); input?.setSelectionRange(faqSearch.length,faqSearch.length); }
  });
  document.addEventListener('submit', event => {
    const form = event.target.closest('[data-form]');
    if (!form) return;
    event.preventDefault();
    const input = Object.fromEntries(new FormData(form));
    if (form.dataset.form === 'reply') {
      const text = String(input.text || '').trim(); if (!text) return;
      customer(selectedCustomer).chat.push({ from: 'staff', text: `[DEMO] ${text}`, at: bangkokDay() });
      save('デモ返信をブラウザー内に保存しました（LINE送信なし）');
    } else if (form.dataset.form === 'profile') {
      const item = customer(selectedCustomer);
      item.fullName = String(input.fullName || '').trim().slice(0,100);
      item.birthday = String(input.birthday || ''); item.locale = input.locale;
      item.interests = String(input.interests || '').split(',').map(x => x.trim()).filter(Boolean).slice(0,8);
      item.note = String(input.note || '').trim().slice(0,500);
      item.birthdayConsent = input.birthdayConsent === 'on'; item.optedOut = input.optedOut === 'on';
      save(`${item.name}の架空プロフィールを更新しました`);
    } else if (form.dataset.form === 'booking-new') {
      const id = `DEMO-B${state.nextId++}`;
      state.bookings.push({ id, customerId: input.customerId, menuId: input.menuId,
        day: input.day, time: input.time, status: 'pending' });
      selectedBooking = id; save(`${id}をスタッフ確認待ちに追加しました（架空予約）`);
    } else if (form.dataset.form === 'booking-edit') {
      const item = booking(selectedBooking);
      const candidate = { ...item, day: input.day, time: input.time };
      if (item.status === 'confirmed') {
        const result = canConfirmDemo(state, candidate);
        if (!result.ok) { message(result.reason, true); return; }
      }
      item.day = input.day; item.time = input.time;
      if (item.status === 'attended') item.status = 'pending';
      save(`${item.id}の日時を更新しました（架空予約）`);
    } else if (form.dataset.form === 'rule') {
      const item = state.rules.find(row => row.id === selectedRule);
      item.enabled = input.enabled === 'on'; item.time = item.kind === 'hour_before' ? '' : input.time;
      if (item.kind === 'followup') item.days = Math.max(1,Math.min(30,Number(input.days) || 7));
      if (item.kind === 'performed') item.sendDate = String(input.sendDate || '');
      item.text = String(input.text || '').slice(0,300);
      item.textEn = String(input.textEn || '').slice(0,300);
      item.textTh = String(input.textTh || '').slice(0,300);
      simulation = null; save(`${item.label}のデモルールを保存しました（送信なし）`);
    } else if (form.dataset.form === 'simulate') {
      simulation = { at: input.at, results: simulateCrm(state, input.at) };
      render(); message(`${simulation.results.length}件の候補を計算しました。外部送信はありません。`);
    } else if (form.dataset.form === 'campaign') {
      const title = String(input.title || '').trim(); if (!title) return;
      state.campaigns.push({ title: title.slice(0,80), expires: input.expires });
      save('架空のキャンペーンをデモ内へ追加しました');
    } else if (form.dataset.form === 'settings') {
      state.settings = { ...state.settings, open: input.open, close: input.close,
        lastStart: input.lastStart, staffWeekday: Number(input.staffWeekday),
        staffWeekend: Number(input.staffWeekend) };
      save('受付のデモ設定をブラウザー内に保存しました');
    }
  });
  document.querySelector('#refresh').addEventListener('click', () => {
    try { state = safeDemoState(JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY))) || state; }
    catch { /* Keep current synthetic state. */ }
    render(); message('架空データを再読み込みしました');
  });
  window.addEventListener('hashchange', () => {
    const next = location.hash.replace(/^#\/?/, '');
    view = Object.hasOwn(names, next) ? next : 'inbox'; render();
  });
  render();
})();

  function dataError(error) { if (!['stale_response','unauthorized'].includes(error.message)) {

  } }
  function projection(data, operation) {
    if (data?.version !== 1 || data.scope !== 'registered_test_customers' || data.operation !== operation || data.readOnly !== true) throw new Error('invalid_response');
    return data;
  }
  return {
    configured,
    snapshot() { expire(); return structuredClone(state); },
    subscribe(listener) { listeners.add(listener); listener(this.snapshot()); return () => listeners.delete(listener); },
    async beginSignIn() {
      if (!configured) throw new Error('not_connected');
      clear('signing_in');
      try { const value = await call('/auth/challenge', { method: 'POST', body: {} });
        if (value.clientId !== clientId || !/^[a-f0-9]{64}$/.test(value.challengeId || '') || !/^[a-f0-9]{64}$/.test(value.nonce || '')) throw new Error('invalid_response');
        challenge = value; return { clientId, nonce: value.nonce };
      } catch (error) { dataError(error); throw error; }
    },
    async completeSignIn(credential) {
      if (!challenge) throw new Error('invalid_login');
      try { const value = await call('/auth/google', { method: 'POST', body: { challengeId: challenge.challengeId, credential } });
        if (!/^[a-f0-9]{64}$/.test(value.token || '') || !Number.isFinite(value.expiresAt) || value.expiresAt <= now() || value.expiresAt > now() + 900000 || value.mode !== 'test_read_only') throw new Error('invalid_response');
        token = value.token; expiresAt = value.expiresAt; challenge = null;
        state = { ...state, status: 'authenticated', error: null }; emit();
      } catch (error) { dataError(error); throw error; }
    },
    async refresh() {
      try { const current = generation; const [customerData, bookingData] = await Promise.all([
        call('/api/test/customers', { authenticated: true }), call('/api/test/bookings', { authenticated: true })]);
        if (current !== generation) return;
        const customers = projection(customerData, 'customers').customers, bookings = projection(bookingData, 'bookings').bookings;
        if (!Array.isArray(customers) || !Array.isArray(bookings)) throw new Error('invalid_response');
        state = { status: 'connected', customers, bookings, messages: [], error: null }; emit();
      } catch (error) { dataError(error); throw error; }
    },
    async conversation(customerId) {
      if (!state.customers.some(x => x.id === customerId) || !/^[a-zA-Z0-9-]{1,64}$/.test(customerId)) throw new Error('not_found');
      try { const data = projection(await call(`/api/test/customers/${encodeURIComponent(customerId)}/conversation`, { authenticated: true }), 'conversation');
        if (data.completeTranscript !== false || !Array.isArray(data.messages)) throw new Error('invalid_response');
        state = { ...state, messages: data.messages }; emit();
      } catch (error) { dataError(error); throw error; }
    },
    async logout() { const oldToken = token; clear(configured ? 'ready' : 'not_connected');
      if (!oldToken) return;
      try { await fetchImpl(origin + '/auth/logout', { method: 'POST', credentials: 'omit', redirect: 'error',
        signal: AbortSignal.timeout(5000), headers: { authorization: `Bearer ${oldToken}` } }); } catch { /* Local session always cleared; server session expires within 15 min. */ }
    },
  };
}

function mountTestPanel(root, client, googleProvider = () => window.google) {
  const make = (tag, text, className) => { const e = document.createElement(tag); if (text) e.textContent = text; if (className) e.className = className; return e; };
  const status = make('p', '', 'demo-note'), detail = make('p', '', 'subtle');
  const login = make('button', 'Googleログインの準備', 'action'), refresh = make('button', 'TESTデータを取得', 'action secondary');
  const logout = make('button', 'ログアウト', 'action secondary');
  const googleButton = make('div'), content = make('div'), errors = make('p', '', 'error');
  login.type = refresh.type = logout.type = 'button'; errors.hidden = true;
  const actions = make('div', '', 'button-row'); actions.append(login, refresh, logout);
  root.replaceChildren(status, detail, actions, googleButton, errors, content);
  const report = () => { errors.hidden = false; errors.textContent = '接続を確認できませんでした。表示中の実データを消去しました。設定またはログイン状態をご確認ください。'; };
  login.onclick = async () => {
    errors.hidden = true;
    try {
      const config = await client.beginSignIn();
      if (!googleProvider()?.accounts?.id) await new Promise((resolve, reject) => {
        const script = document.createElement('script'); script.src = 'https://accounts.google.com/gsi/client';
        script.onload = resolve; script.onerror = reject; document.head.append(script);
      });
      googleProvider().accounts.id.initialize({ client_id: config.clientId, nonce: config.nonce, auto_select: false,
        callback: async response => { try { await client.completeSignIn(response.credential); await client.refresh(); } catch { report(); } } });
      googleProvider().accounts.id.renderButton(googleButton, { type: 'standard', text: 'signin_with', theme: 'outline', size: 'large' });
    } catch { report(); }
  };
  refresh.onclick = async () => { errors.hidden = true; try { await client.refresh(); } catch { report(); } };
  logout.onclick = async () => { googleButton.replaceChildren(); await client.logout(); };
  const statuses = { not_connected: '実TEST未接続', ready: '実TEST未接続・ログインが必要です', signing_in: 'ログイン準備中',
    authenticated: 'ログイン済み・TESTデータ未取得', connected: '実TESTデータを取得済み（閲覧のみ）', expired: 'ログイン期限切れ', error: '実TESTの接続を確認できません' };
  const unsubscribe = client.subscribe(state => {
    status.textContent = statuses[state.status] || statuses.error;
    const pill = document.getElementById('connection-pill');
    if (pill) pill.textContent = state.status === 'connected' ? '実TEST閲覧のみ' : '実TEST未接続';
    detail.textContent = '実TESTの登録済み利用者だけを表示します。会話は保存済み要約です。Google予定の状態は保存記録であり、この画面での再照合はまだ行いません。';
    login.disabled = !client.configured || state.status === 'signing_in';
    refresh.disabled = !['authenticated','connected'].includes(state.status);
    logout.disabled = ['not_connected','ready'].includes(state.status);
    content.replaceChildren();
    if (state.status !== 'connected') return;
    const customerList = make('div', '', 'button-row');
    for (const customer of state.customers) { const button = make('button', customer.displayName, 'action secondary'); button.type = 'button';
      button.onclick = async () => { try { await client.conversation(customer.id); } catch { report(); } }; customerList.append(button); }
    content.append(make('h3', 'TEST顧客'), customerList, make('h3', 'TEST予約'));
    if (!state.bookings.length) content.append(make('p', '対象のTEST予約はありません。', 'empty'));
    for (const booking of state.bookings) content.append(make('p', `${booking.startsAt} / ${booking.menu} / ${booking.status}`, 'demo-note'));
    content.append(make('h3', '保存済みの会話要約'));
    for (const message of state.messages) content.append(make('p', `${message.at} / ${message.direction}: ${message.text}`, 'demo-note'));
  });
  const expiryTimer = setInterval(() => client.snapshot(), 15000);
  return () => { unsubscribe(); clearInterval(expiryTimer); };
}
// Configuration remains empty until a real endpoint and approved client ID exist.
const localClient = createTestClient({ apiOrigin: '', clientId: '' });
let unmount;
function mount() { unmount?.(); const root = document.getElementById('test-connection-root'); if (root) unmount = mountTestPanel(root, localClient); }
if (typeof document !== 'undefined') { document.addEventListener('salon-test-panel', mount); mount(); }
</script></body></html>
